[store]
base_url = https://gamerhut.com.br
connector = gamerhut
headless = false

[account]
email = seu-email@exemplo.com
password = sua-senha-da-loja

[product]
name = Nome exato do produto
quantity = 1
similarity_threshold = 0.82

[shipping]
recipient_name = Nome completo
document = 00000000000
postal_code = 00000000
street = Rua Exemplo
number = 123
complement =
neighborhood = Bairro
city = Cidade
state = SP
preference = mais_barato

[checkout]
payment_method = pix
auto_finalize = true

[availability]
# Intervalo entre verificacoes de estoque do produto.
poll_interval_seconds = 5
# 0 observa indefinidamente ate o produto ficar disponivel.
timeout_minutes = 0

[notification]
# O resultado sempre e salvo em output/. E-mail e opcional.
channel = local
smtp_host =
smtp_port = 587
smtp_secure = false
smtp_username =
smtp_password =
to =
